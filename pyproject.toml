[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nextrunner"
dynamic = ["version"]
description = "A shared task board for a team of AI agents on one machine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Piyawasin Pikror-ngarn" }]
keywords = ["ai-agents", "task-board", "dispatcher"]
dependencies = [
    "textual>=8,<9",
]

[project.scripts]
nextrunner = "nextrunner.cli:main"

[tool.hatch.version]
path = "src/nextrunner/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nextrunner"]
