name: test
on:
  push:
    branches: [main]
  pull_request:

env:
  # The uv cache and the checkout sit on different drives on Windows runners, so uv cannot hardlink
  # and says so on every run; copying is what it does anyway.
  UV_LINK_MODE: copy
  # Name git's first branch, so the `git init` inside actions/checkout prints no hint about it.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.25"
          python-version: ${{ matrix.python }}
      - run: uv run python -W ignore -m unittest -v
