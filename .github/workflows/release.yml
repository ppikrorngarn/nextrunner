# Builds the single-file app on every target and, for a tag like v0.2.0, attaches the files to a GitHub Release.
# PyInstaller cannot cross-compile, so each target builds on its own runner.
# Actions are pinned to a commit, with the tag as a comment, so a moved tag cannot change what runs here;
# Dependabot (.github/dependabot.yml) proposes the updates.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # The uv cache and the checkout sit on different drives on Windows runners, so uv cannot hardlink
  # and says so on every run; copying is what it does anyway.
  UV_LINK_MODE: copy
  # Name git's first branch, so the `git init` inside actions/checkout prints no hint about it.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, name: nextrunner-macos-arm64}
          - {os: macos-15-intel, name: nextrunner-macos-x64}
          - {os: ubuntu-latest, name: nextrunner-linux-x64}
          - {os: ubuntu-24.04-arm, name: nextrunner-linux-arm64}
          - {os: windows-latest, name: nextrunner-windows-x64, experimental: true}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.25"
          python-version: "3.13"
      - name: Tests
        run: uv run python -W ignore -m unittest
      - name: Build and smoke-test the app
        run: uv run --with pyinstaller==6.22.3 python packaging/build.py --name ${{ matrix.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # to sign the provenance attestation
      attestations: write  # to store it with the repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Attest where the files were built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
